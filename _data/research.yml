- title: Dark Proteome
  research_title: The Dark Proteome (IDPs)
  image: DarkProteome.png
  description: While much of the ordered protein machinery has been mapped, the Dark Proteome represents a significant challenge for targeted therapeutics.
  projects:
    - slug: P7-P53
      title: Exploring the Disordered Regions of P53
      image: p53DisorderedRegions.png
      raised_image: true
      description: Exploring the conformational landscapes of four intrinsically disordered regions.
    - slug: P2-PRD
      title: Untangling the Proline-Rich Regions of Tau
      image: Front2-PRD.png
      description: Investigating protein flexibility and interactions in p53 and Tau.
    - slug: CHCHD2
      title: Untangling CHCHD2?
      description: Exploring CHCHD2 as a new research direction within the Dark Proteome.
- title: Undruggable Receptors
  research_title: Orphan Nuclear Receptors
  image: UndruggableReceptor-4c76ed6fde.png
  description: Many proteins represent a complex challenge for scientists, as not even a natural ligand has been found. Complex challenges require elegant solutions.
  projects:
    - slug: Deorphanizing-NR2F6
      title: Deorphanizing NR2F6
      image: Front3-ONR.png
      description: Investigating potential binding partners and approaches to understanding NR2F6 recognition.
    - slug: NR2F6-NSD1
      title: Peptidomimetic Modeling of the NR2F6:NSD1 Interactions
      image: NR2F6-NSD1-Interactions.png
      description: Modeling peptide-inspired approaches to NR2F6–NSD1 interactions.
    - slug: PXR-Allosteric
      title: 'PXR: Potential New Allosteric Sites?'
      image: Front3-ONR.png
      description: Investigating potential new allosteric sites in PXR.
- title: Peptidomimetics
  image: Peptidomimetics-8aaf339adc.png
  description: While small-molecule ligands are frequently tested in large quantities using HITS, peptidomimetics present a unique solution – hijacking biology itself.
  projects:
    - slug: Novel-Peptidomimetics
      title: Development of Novel Peptidomimetics
      description: Exploring new peptide-inspired approaches to pharmaceutical design.
    - slug: Mimicking-Interactions
      title: Mimicking Protein Interactions
      description: Investigating which protein interactions to reproduce with peptidomimetics.
    - slug: Glycosylation-Sites
      title: Side-stepping Glycosylation Sites
      description: Exploring glycosylation sites as a consideration in peptidomimetic interaction design.
